[llm]
provider = "openai_compat"                # key in llm/registry.py: openai_compat | anthropic
model = "gemini-flash-latest"             # any model ID the provider accepts
max_output_tokens = 16000                 # Gemini counts thinking tokens against this
temperature = 0.2

[llm.fallback]                            # used on rate limits, outages or bad output
provider = "openai_compat"
model = "gemini-flash-lite-latest"

[search]
provider = "tavily"                       # tavily | brave | claude_websearch | none
max_results = 8

[sources]
nusmods = true
disqus = true
reddit = true
websearch = true
reddit_archive = true
course_pages = true
blogs = true

[limits]
max_chars_per_doc = 6000
max_total_chars = 120000                  # budget for all text sent to the LLM
max_input_tokens_per_report = 60000       # cost guard: chars / 4 estimate
cache_ttl_days = 14
max_source_age_years = 4
min_recent_docs = 10
http_timeout_s = 20

[server]
host = "127.0.0.1"
port = 8765

# Prices in USD per million tokens. Edit freely; unknown models show tokens only.
# Gemini on the free tier costs nothing, so it is listed at 0.
[pricing."gemini-flash-latest"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."gemini-flash-lite-latest"]
input_per_mtok = 0.0
output_per_mtok = 0.0

[pricing."claude-haiku-4-5-20251001"]
input_per_mtok = 1.0
output_per_mtok = 5.0

[pricing."claude-haiku-4-5"]
input_per_mtok = 1.0
output_per_mtok = 5.0

[pricing."claude-sonnet-5"]
input_per_mtok = 2.0
output_per_mtok = 10.0

[pricing."claude-opus-5"]
input_per_mtok = 5.0
output_per_mtok = 25.0
